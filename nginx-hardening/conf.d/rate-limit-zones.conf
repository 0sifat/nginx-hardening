# /etc/nginx/conf.d/rate-limit-zones.conf
# http-context: define shared zones once. Apply them via snippets/rate-limit.conf.
# If Nginx sits behind a load balancer/CDN, configure real_ip first (see conf.d/real-ip.conf.example)
# or every client will share the LB's IP.

# General traffic: 10 req/s per IP
limit_req_zone  $binary_remote_addr zone=req_general:10m rate=10r/s;

# Sensitive endpoints (login, OTP, password reset): 5 req/min per IP
limit_req_zone  $binary_remote_addr zone=req_login:10m   rate=5r/m;

# API: 30 req/s per IP
limit_req_zone  $binary_remote_addr zone=req_api:10m     rate=30r/s;

# Concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Return 429 instead of the default 503
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
