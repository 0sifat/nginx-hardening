# /etc/nginx/nginx.conf
# Global settings only. Security concerns live in snippets/ and conf.d/.

user www-data;                      # non-root worker user (use "nginx" on RHEL/Amazon Linux)
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 65535;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    ## Basics
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ## Hide version / fingerprinting
    server_tokens off;

    ## No directory listing anywhere by default
    autoindex off;

    ## Request size, buffers, timeouts (anti-Slowloris / oversized requests)
    include /etc/nginx/snippets/request-limits.conf;

    ## Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    ## Compression (don't gzip over TLS for secret-bearing responses if you're worried about BREACH)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    ## http-context security config (rate-limit zones, maps, etc.)
    include /etc/nginx/conf.d/*.conf;

    ## Virtual hosts
    include /etc/nginx/sites-enabled/*;
}
