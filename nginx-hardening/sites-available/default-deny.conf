# /etc/nginx/sites-available/default-deny.conf
# Catch-all: drop requests for unknown Host headers / direct-IP scans.
# Enable: ln -s /etc/nginx/sites-available/default-deny.conf /etc/nginx/sites-enabled/
# (and remove the distro "default" site)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;   # close connection, no response
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # nginx >= 1.19.4 (Ubuntu 22.04 ships 1.18 - upgrade or use a self-signed cert + return 444): reject TLS handshake without needing a real cert
    ssl_reject_handshake on;
    include snippets/ssl-params.conf;

    # HTTP/2 connection reuse can still route a request here - answer deterministically
    location / {
        return 421;
    }
}
