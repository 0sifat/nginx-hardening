# /etc/nginx/sites-available/app.conf
# Example vhost: only includes what it needs.
# Enable: ln -s /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/

upstream app_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# www -> apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    ssl_certificate         /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/example.com/privkey.pem;
    # ssl_trusted_certificate .../chain.pem;   # only if OCSP stapling is enabled (not for Let's Encrypt)
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;   # HSTS on the redirect host too

    return 301 https://example.com$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate         /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/example.com/privkey.pem;
    # ssl_trusted_certificate .../chain.pem;   # only if OCSP stapling is enabled (not for Let's Encrypt)

    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;
    include snippets/limit-methods.conf;
    include snippets/deny-sensitive.conf;

    access_log /var/log/nginx/example.com.access.log main;
    error_log  /var/log/nginx/example.com.error.log warn;

    # Brute-force protection on login
    location = /login {
        limit_req zone=req_login burst=3 nodelay;
        include snippets/proxy-params-secure.conf;
        proxy_pass http://app_backend;
    }

    # API with its own limit
    location /api/ {
        limit_req zone=req_api burst=50 nodelay;
        include snippets/proxy-params-secure.conf;
        proxy_pass http://app_backend;
    }

    # Static assets - re-include headers because add_header below would drop them
    location /static/ {
        alias /var/www/example.com/static/;   # trailing slash on both sides avoids alias traversal
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        include snippets/proxy-params-secure.conf;
        proxy_pass http://app_backend;
    }
}
