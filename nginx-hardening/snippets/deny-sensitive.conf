# /etc/nginx/snippets/deny-sensitive.conf
# server-context: never serve dotfiles, VCS dirs, secrets, or backups.
# Uses return 404 (not deny) so scanners can't confirm the file exists.
# Note: return runs before allow/deny, so don't mix them in one block.

# Hidden files/dirs (.git, .env, .htaccess, .svn) - but allow ACME/.well-known
location ~ /\.(?!well-known/) {
    access_log off;
    log_not_found off;
    return 404;
}

# Backups, dumps, editor leftovers, config/source files
location ~* \.(bak|backup|old|orig|save|swp|swo|tmp|sql|sql\.gz|tar|tar\.gz|tgz|zip|7z|rar|log|ini|conf|env|yml|yaml|pem|key|crt)$ {
    return 404;
}

# Common tooling and dependency directories
location ~* ^/(vendor|node_modules|composer\.(json|lock)|package(-lock)?\.json|Dockerfile|docker-compose\.ya?ml)(/|$) {
    return 404;
}