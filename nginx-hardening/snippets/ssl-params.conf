# /etc/nginx/snippets/ssl-params.conf
# server-context: modern TLS (Mozilla "intermediate" profile).
# Certificate paths stay in the vhost; this file is protocol/cipher policy only.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;       # let clients pick (all listed ciphers are strong)

# DH params for DHE ciphers: openssl dhparam -out /etc/nginx/dhparam.pem 2048
ssl_dhparam /etc/nginx/dhparam.pem;

# ssl_ecdh_curve intentionally NOT set: an explicit list overrides OpenSSL 3.5+'s
# default (X25519MLKEM768 hybrid) and silently disables post-quantum key exchange.

# Sessions
ssl_session_timeout 1d;
ssl_session_cache   shared:SSL:10m;  # ~40k sessions
ssl_session_tickets off;             # preserves forward secrecy

# OCSP stapling - ONLY for commercial CAs that still run OCSP responders.
# Let's Encrypt retired OCSP on 2025-08-06; with LE certs these lines are dead config.
# If enabled, also set ssl_trusted_certificate (chain.pem) in the vhost and use a
# LOCAL resolver (external resolvers allow DNS-spoofing): 127.0.0.53 (systemd-resolved)
# or 169.254.169.253 (AWS VPC DNS).
# ssl_stapling        on;
# ssl_stapling_verify on;
# resolver 127.0.0.53 valid=300s;
# resolver_timeout 5s;
