# /etc/nginx/snippets/proxy-params-secure.conf
# location-context: safe defaults for reverse-proxying to an app backend.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# Don't let clients smuggle these to the backend
proxy_set_header X-Original-URL    "";
proxy_set_header X-Rewrite-URL     "";

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_buffer_size 8k;
proxy_buffers     8 16k;

# Don't follow redirects from upstream into internal hosts
proxy_redirect off;
