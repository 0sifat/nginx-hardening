# /etc/nginx/snippets/rate-limit.conf
# server-context: general rate + connection limits.
# Zones are defined in conf.d/rate-limit-zones.conf.

limit_req  zone=req_general burst=20 nodelay;
limit_conn conn_per_ip 20;

# For stricter endpoints, add inside a location block, e.g.:
#   location = /login {
#       limit_req zone=req_login burst=3 nodelay;
#       proxy_pass http://app_backend;
#   }
#   location /api/ {
#       limit_req zone=req_api burst=50 nodelay;
#       proxy_pass http://app_backend;
#   }
