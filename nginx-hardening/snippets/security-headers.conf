# /etc/nginx/snippets/security-headers.conf
# server-context security headers.
#
# GOTCHA: any add_header inside a location {} REPLACES all inherited add_header
# directives. If a location needs its own header, re-include this file there:
#   location /static/ {
#       include snippets/security-headers.conf;
#       add_header Cache-Control "public, max-age=31536000";
#   }

# HSTS - only once HTTPS works on every subdomain. Add "preload" only if you mean it.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP - start in Report-Only, watch the browser console, then switch to enforcing.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# add_header Content-Security-Policy "...same policy..." always;

# Hide upstream fingerprinting headers (PHP, Express, etc.)
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;
proxy_hide_header Server;
