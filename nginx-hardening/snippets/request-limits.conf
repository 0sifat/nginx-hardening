# /etc/nginx/snippets/request-limits.conf
# Included in http {}. Limits request size and closes slow/idle clients.

# Max upload size - raise per-location for upload endpoints
client_max_body_size 10m;

# Buffers - keep small to limit memory abuse
client_body_buffer_size     16k;
client_header_buffer_size   1k;
large_client_header_buffers 4 8k;

# Timeouts - drop slow clients (Slowloris-style attacks)
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          10s;
keepalive_timeout     15s;
keepalive_requests    1000;

# Free memory held by timed-out connections
reset_timedout_connection on;
